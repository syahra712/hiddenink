name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push has nothing useful left to say; cancel it rather than
# paying for a run whose result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy

  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          marklens --version
          marklens inspect README.md --quiet

  # The zero-dependency guarantee is load-bearing -- it is the reason the trust
  # story is auditable end to end -- so it gets verified in an environment with
  # nothing else installed, not just asserted in the README.
  zero-dependency:
    name: zero-dependency install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with no extras
        run: pip install .
      - name: Assert nothing third-party came with it
        run: |
          python - <<'PY'
          import re, subprocess, sys

          frozen = subprocess.run(
              [sys.executable, "-m", "pip", "freeze"],
              capture_output=True, text=True, check=True,
          ).stdout

          # A local install freezes as "marklens @ file:///path", so splitting on
          # whitespace yields three tokens and treats "@" as a dependency. Parse
          # the distribution name off the front of each *line* instead.
          names = []
          for line in frozen.splitlines():
              line = line.strip()
              if not line or line.startswith(("#", "-e ")):
                  continue
              names.append(re.split(r"[\s@=<>!~\[]", line, maxsplit=1)[0].lower())

          extra = [n for n in names if n != "marklens"]
          assert not extra, f"core install pulled in dependencies: {extra}"
          print(f"OK: zero dependencies (pip freeze -> {names})")
          PY
      - name: CLI works on a clean install
        run: marklens inspect README.md --quiet
