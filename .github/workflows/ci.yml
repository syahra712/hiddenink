name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push has nothing useful left to say; cancel it rather than
# paying for a run whose result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy

  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          hiddenink --version
          hiddenink inspect README.md --quiet

  # PyPI renders a project page from the README inside the uploaded artifact,
  # and a version can never be re-uploaded. 0.1.0 shipped a README saying the
  # package was "not on PyPI yet" because it was corrected after the build, so
  # the artifact is now checked against the working tree on every commit.
  release-integrity:
    name: release integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build "twine>=6.1" "packaging>=25"
      - name: Build
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Artifact must match the repository
        run: pytest tests/test_release.py -q
      - name: Test the installed wheel outside the source tree
        run: |
          python -m venv /tmp/hiddenink-wheel
          /tmp/hiddenink-wheel/bin/pip install dist/*.whl pytest
          cd /tmp
          /tmp/hiddenink-wheel/bin/python -m pytest "$GITHUB_WORKSPACE/tests" -q
          /tmp/hiddenink-wheel/bin/hiddenink --version

  # The zero-dependency guarantee is load-bearing -- it is the reason the trust
  # story is auditable end to end -- so it gets verified in an environment with
  # nothing else installed, not just asserted in the README.
  zero-dependency:
    name: zero-dependency install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with no extras
        run: pip install .
      - name: Assert nothing third-party came with it
        run: |
          python - <<'PY'
          import re, subprocess, sys

          frozen = subprocess.run(
              [sys.executable, "-m", "pip", "freeze"],
              capture_output=True, text=True, check=True,
          ).stdout

          # A local install freezes as "hiddenink @ file:///path", so splitting on
          # whitespace yields three tokens and treats "@" as a dependency. Parse
          # the distribution name off the front of each *line* instead.
          names = []
          for line in frozen.splitlines():
              line = line.strip()
              if not line or line.startswith(("#", "-e ")):
                  continue
              names.append(re.split(r"[\s@=<>!~\[]", line, maxsplit=1)[0].lower())

          extra = [n for n in names if n != "hiddenink"]
          assert not extra, f"core install pulled in dependencies: {extra}"
          print(f"OK: zero dependencies (pip freeze -> {names})")
          PY
      - name: CLI works on a clean install
        run: hiddenink inspect README.md --quiet

  # The conformance corpus is project-authored regression evidence, not an
  # independent comparison. The destructive- and inert-tool guardrails in
  # tests/test_audit.py stop it decaying into a pass-everything harness.
  conformance:
    name: conformance corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Score hiddenink against the corpus
        run: |
          python - <<'PY'
          from hiddenink.audit import correctness_cases, hiddenink_adapter, run_tool

          result = run_tool("hiddenink", hiddenink_adapter(), correctness_cases())
          passed, total = result.correctness
          for outcome in result.outcomes:
              if not outcome.passed:
                  print(f"FAIL {outcome.case.name}: {outcome.case.why}")
                  print(f"     expected {outcome.case.expect!r}")
                  print(f"     produced {outcome.produced!r} {outcome.error}")
          print(f"correctness {passed}/{total}")
          assert passed == total, f"{total - passed} conformance failure(s)"
          PY
      - name: RESULTS.md is regenerated and committed
        run: |
          python -m hiddenink.audit > /tmp/fresh.md
          python - <<'PY'
          # Runtime metadata differs by runner, so compare only the self-run
          # summary result rather than treating environment drift as staleness.
          fresh = open("/tmp/fresh.md").read()
          committed = open("RESULTS.md").read()
          summary = fresh.split("## Summary", 1)[1].split("##", 1)[0]
          row = next(
              line for line in summary.splitlines()
              if line.startswith("| hiddenink |")
          )
          assert row in committed, (
              f"RESULTS.md is stale -- regenerate it.\n  expected row: {row}"
          )
          print("RESULTS.md hiddenink row is current")
          PY
