name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          marklens --version
          marklens inspect README.md --quiet

  # The core's zero-dependency guarantee is load-bearing: it is why the trust
  # story is auditable. Verify it in an environment with nothing else present.
  zero-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without any extras
        run: pip install .
      - name: Assert nothing third-party was pulled in
        run: |
          python - <<'PY'
          import subprocess, sys
          frozen = subprocess.run(
              [sys.executable, "-m", "pip", "freeze"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          extra = [p for p in frozen if not p.lower().startswith("marklens")]
          assert not extra, f"core install pulled in dependencies: {extra}"
          print("OK: marklens installs with zero dependencies")
          PY
      - name: CLI works on a clean install
        run: marklens inspect README.md --quiet
