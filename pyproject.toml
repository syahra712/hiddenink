[build-system]
# Pinned below 1.28 deliberately. Newer hatchling emits Metadata-Version 2.5,
# and nothing on PyPI is currently published with it -- the newest seen in the
# wild is 2.4 -- so uploading 2.5 risks a server-side rejection that would only
# surface after a release attempt. 1.27 emits 2.4 and still supports the PEP 639
# `license = "Apache-2.0"` expression below, so nothing is given up.
# Lift this once PyPI is confirmed to accept 2.5.
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "hiddenink"
version = "0.1.2"
description = "Find the ink you can't see. Inspects and cleans invisible Unicode, homoglyphs, and container metadata — and says precisely what it did not do."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Syed Ahnaf Raza" }]
keywords = [
    "watermark", "provenance", "c2pa", "unicode", "zero-width",
    "ai-detection", "text-hygiene", "trojan-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Security",
    "Typing :: Typed",
]
# The core is deliberately dependency-free: it must be auditable end to end
# and installable in an air-gapped environment.
dependencies = []

[project.optional-dependencies]
c2pa = ["c2pa-python>=0.7"]
research = ["transformers>=4.46", "torch>=2.0", "numpy>=1.24", "scipy>=1.10"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
hiddenink = "hiddenink.cli:main"

[project.urls]
Homepage = "https://github.com/syahra712/hiddenink"
Issues = "https://github.com/syahra712/hiddenink/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hiddenink"]
artifacts = ["src/hiddenink/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/hiddenink"]
