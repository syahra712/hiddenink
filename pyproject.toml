[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hiddenink"
version = "0.2.1"
description = "Inspect and conservatively clean hidden Unicode and supported file metadata, with explicit coverage and refusal reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Syed Ahnaf Raza" }]
keywords = [
    "watermark", "provenance", "c2pa", "unicode", "zero-width",
    "text-hygiene", "trojan-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Security",
    "Typing :: Typed",
]
# The core is deliberately dependency-free: it must be auditable end to end
# and installable in an air-gapped environment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
hiddenink = "hiddenink.cli:main"

[project.urls]
Homepage = "https://github.com/syahra712/hiddenink"
Issues = "https://github.com/syahra712/hiddenink/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hiddenink"]
artifacts = ["src/hiddenink/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/hiddenink"]
